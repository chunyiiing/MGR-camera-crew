<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="pragma" content="no-cache"/>
<meta http-equiv="expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#1a1a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MGR攝影組器材管理"/>
<!-- Open Graph -->
<meta property="og:title" content="MGR攝影組器材管理"/>
<meta property="og:description" content="嗨嗨~~測試中呦👻"/>
<meta property="og:type" content="website"/>
<title>MGR攝影組器材管理</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── reset & base ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  touch-action:pan-x pan-y;-webkit-text-size-adjust:none;text-size-adjust:none;}
input,textarea,select{-webkit-user-select:auto;user-select:auto;}
body{margin:0;font-family:'Noto Sans TC',sans-serif;background:#1a1a1a;color:#e8e8e8;
  overscroll-behavior:none;touch-action:pan-y;}

/* ── layout ── */
.topbar{position:fixed;top:0;left:0;right:0;height:50px;background:#1a1a1a;
  border-bottom:1px solid #2e2e2e;display:flex;align-items:center;padding:0 12px;z-index:100;gap:8px;}
.scroll-area{position:fixed;top:50px;bottom:68px;left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 80px;}
.scroll-area::-webkit-scrollbar{display:none;}
/* ★ Fixed bottom nav */
.bottom-nav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;
  background:#1e1e1e;border-top:1px solid #2e2e2e;
  padding-bottom:env(safe-area-inset-bottom);z-index:9999!important;display:flex;
  transform:none!important;will-change:auto;}

/* ── tabs ── */
.tab-pane{display:none;}.tab-pane.active{display:block;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:1px;
  background:none;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.nav-btn .ni{font-size:18px;line-height:1;}
.nav-btn .nl{font-size:9px;color:#555;font-weight:500;}
.nav-btn.active .nl{color:#f0a500;}

/* ── buttons ── */
.btn{display:block;width:100%;padding:12px 14px;border:none;border-radius:13px;font-size:14px;
  font-weight:600;font-family:'Noto Sans TC',sans-serif;cursor:pointer;-webkit-appearance:none;
  text-align:center;transition:opacity .1s;}
.btn:active{opacity:.72;}
.btn-gold{background:#f0a500;color:#1a1a1a;}
.btn-dark{background:#2e2e2e;color:#e8e8e8;}
.btn-red{background:#ef4444;color:#fff;}
.btn-green{background:#22c55e;color:#1a1a1a;}
.btn-blue{background:#3b82f6;color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:9px;width:auto;}

/* ── inputs ── */
.inp{display:block;width:100%;padding:10px 13px;background:#2e2e2e;border:1.5px solid #3a3a3a;
  border-radius:11px;color:#e8e8e8;font-size:14px;font-family:'Noto Sans TC',sans-serif;
  outline:none;-webkit-appearance:none;}
.inp:focus{border-color:#f0a500;}
select.inp option{background:#2e2e2e;}
textarea.inp{resize:none;}

/* ── cards ── */
.card{background:#2e2e2e;border-radius:14px;padding:12px;margin-bottom:8px;}

/* ── chips ── */
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.c-green{background:rgba(34,197,94,.15);color:#22c55e;}
.c-red{background:rgba(239,68,68,.15);color:#ef4444;}
.c-yellow{background:rgba(245,158,11,.15);color:#f59e0b;}
.c-blue{background:rgba(59,130,246,.15);color:#3b82f6;}
.c-gray{background:rgba(120,120,120,.15);color:#888;}
.c-orange{background:rgba(240,165,0,.18);color:#f0a500;}
.c-purple{background:rgba(168,85,247,.18);color:#a855f7;}

/* ── modals ── */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);
  backdrop-filter:blur(5px);display:none;align-items:flex-end;}
.modal.open{display:flex;}
.sheet{background:#242424;border-radius:20px 20px 0 0;padding:16px;
  width:100%;max-height:92dvh;overflow-y:auto;}
.handle{width:36px;height:4px;background:#3a3a3a;border-radius:2px;margin:0 auto 14px;}

/* ── scanner ── */
.scan-box{border:2px solid #f0a500;border-radius:11px;overflow:hidden;display:none;
  position:relative;cursor:pointer;}
.scan-box video{display:block;width:100%;}
.scan-focus-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;pointer-events:none;}

/* ── toast ── */
#toaster{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;white-space:nowrap;}
.toast{background:#2e2e2e;color:#e8e8e8;padding:8px 16px;border-radius:11px;font-size:13px;
  box-shadow:0 4px 20px rgba(0,0,0,.6);border-left:3px solid #f0a500;animation:tin .18s ease;}
.toast.t-err{border-left-color:#ef4444;background:#3a1a1a;color:#fca5a5;}
.toast.t-warn{border-left-color:#f59e0b;}
.toast.t-ok{border-left-color:#22c55e;}
@keyframes tin{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}

/* ── swipe delete ── */
.sw-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px;}
.sw-card{background:#2e2e2e;border-radius:14px;padding:12px;transition:transform .18s;z-index:1;position:relative;}
.sw-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch;z-index:0;}
.sw-del{background:#ef4444;color:#fff;border:none;padding:0 20px;font-size:13px;
  font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;border-radius:0 14px 14px 0;}

/* ── top status badge ── */
.status-badge{background:rgba(240,165,0,.15);color:#f0a500;border:1px solid rgba(240,165,0,.3);
  border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* ── calendar ── */
.cal-day{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;margin:0 auto;cursor:pointer;}
.cal-day.rented{background:rgba(240,165,0,.2);color:#f0a500;font-weight:700;}
.cal-day.today{outline:2px solid #f0a500;outline-offset:1px;}

/* ── misc ── */
.row{display:flex;gap:8px;}.row>.btn{flex:1;}
label.lbl{display:block;font-size:11px;color:#888;margin-bottom:4px;}
.gap{margin-bottom:10px;}
.sbox{flex:1;background:#1a1a1a;border-radius:9px;padding:7px;text-align:center;}
.sbox .sv{font-size:14px;font-weight:700;}.sbox .sl{font-size:9px;color:#888;margin-top:1px;}
.cat-hd{font-size:12px;font-weight:700;color:#f0a500;padding:8px 0 5px;
  border-bottom:1px solid #2e2e2e;margin-bottom:6px;letter-spacing:.4px;}
.sec-title{font-size:14px;font-weight:600;margin:0 0 8px;}
.warn-banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
  border-radius:11px;padding:10px 14px;color:#ef4444;font-size:13px;font-weight:500;margin-bottom:8px;}

/* ── highlight keywords ── */
.kw{font-weight:700;color:#f0a500;}

/* ── rental list ── */
.rental-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #3a3a3a;cursor:pointer;}
.rental-row:last-child{border-bottom:none;}

/* ── monthly check ── */
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.month-cell{background:#1a1a1a;border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;cursor:pointer;}
.month-cell.checked{background:rgba(34,197,94,.15);color:#22c55e;font-weight:600;}

/* ── rental detail pane ── */
#pane-rental-detail{display:none;flex-direction:column;}
#pane-rental-detail.active{display:flex;}

/* ── inventory item checkboxes ── */
.inv-check-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #3a3a3a;}
.inv-check-item:last-child{border-bottom:none;}
.inv-cb{width:20px;height:20px;border-radius:5px;border:2px solid #3a3a3a;background:#1a1a1a;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.inv-cb.checked{background:#22c55e;border-color:#22c55e;color:#1a1a1a;}
.inv-cb.rented{background:rgba(245,158,11,.2);border-color:#f59e0b;cursor:default;}
.inv-cb.repair{background:rgba(239,68,68,.2);border-color:#ef4444;cursor:default;}
.inv-cb.lost{background:rgba(168,85,247,.2);border-color:#a855f7;cursor:default;}

/* ── month nav bar ── */
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.month-nav-btn{width:32px;height:32px;border-radius:50%;background:#2e2e2e;border:none;
  color:#e8e8e8;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.month-nav-title{flex:1;text-align:center;font-size:13px;font-weight:600;}
</style>
</head>
<body>
<div id="toaster"></div>

<!-- ══ TOP BAR ══ -->
<div class="topbar">
  <span style="color:#f0a500;font-weight:700;font-size:14px;flex-shrink:0">📷 MGR攝影組器材管理</span>
  <span id="topBadge" class="status-badge" style="display:none"></span>
  <div style="margin-left:auto;display:flex;gap:6px;flex-shrink:0">
    <button id="btnSettings" style="width:36px;height:36px;border-radius:50%;background:#2e2e2e;border:none;
      cursor:pointer;font-size:16px;color:#e8e8e8;display:flex;align-items:center;justify-content:center;">⚙️</button>
  </div>
</div>

<div class="scroll-area">

<!-- ═══ PANE: 今日出庫 ═══ -->
<div id="pane-checkout" class="tab-pane active">
  <div class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="row gap" style="align-items:center">
      <select id="checkoutUser" class="inp" style="flex:1">
        <option value="">選擇使用者</option>
        <option>崇瑋</option><option>得生</option><option>純穎</option>
        <option>哲嘉</option><option>子禎</option><option>錢琦</option>
        <option>致瑋</option><option>家暉</option><option>冠智</option>
      </select>
      <button id="btnAddUser" class="btn btn-dark btn-sm">＋</button>
    </div>
    <div class="row" style="gap:6px">
      <div style="flex:1">
        <label class="lbl">出租日期</label>
        <input type="date" id="checkoutDate" class="inp"/>
      </div>
      <div style="flex:1">
        <label class="lbl">單號</label>
        <input type="text" id="checkoutOrderNo" class="inp" placeholder="選填"/>
      </div>
    </div>
  </div>

  <!-- edit mode banner -->
  <div id="editModeBanner" style="display:none;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);
    border-radius:11px;padding:9px 14px;color:#3b82f6;font-size:13px;font-weight:500;margin-bottom:8px;">
    ✏️ 編輯模式：儲存後將覆蓋原租單
  </div>

  <!-- scanner -->
  <div class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:500;flex:1">掃描器材 QR</span>
      <button id="btnScan1" class="btn btn-gold btn-sm">開始掃描</button>
    </div>
    <div id="qr1" class="scan-box">
      <div class="scan-focus-hint">點擊畫面對焦</div>
    </div>
  </div>

  <div id="repairWarn" class="warn-banner" style="display:none">⚠️ 器材維修中，請確認後再出庫</div>

  <div class="row" style="align-items:center;margin-bottom:6px">
    <span style="font-size:13px;font-weight:500;flex:1">出庫品項</span>
    <span id="checkoutCount" class="chip c-gray">0 件</span>
  </div>
  <div id="checkoutItems"></div>
  <div class="row" style="margin-top:6px;padding-bottom:4px">
    <button id="btnSaveCheckout" class="btn btn-gold">💾 儲存出庫</button>
    <button id="btnExportPDF"    class="btn btn-dark">📄 PDF</button>
  </div>
</div>

<!-- ═══ PANE: 儲存成功 ═══ -->
<div id="pane-saved" class="tab-pane">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span class="chip c-orange" style="font-size:13px;padding:4px 12px">✅ 出庫成功</span>
    <span id="savedTitle" style="font-size:14px;font-weight:600;flex:1"></span>
  </div>
  <div class="card" style="margin-bottom:10px">
    <div id="savedMeta" style="font-size:12px;color:#aaa;line-height:2"></div>
  </div>
  <div id="savedList" style="margin-bottom:10px"></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <button id="btnCopyLine"    class="btn btn-dark" style="flex:1;min-width:140px">📋 複製 LINE 清單</button>
    <button id="btnSavedPDF"    class="btn btn-dark" style="flex:1;min-width:100px">📄 PDF</button>
    <button id="btnNewCheckout" class="btn btn-gold" style="flex:1;min-width:120px">＋ 新增出庫</button>
  </div>
</div>

<!-- ═══ PANE: 租單列表 ═══ -->
<div id="pane-rentals" class="tab-pane">
  <!-- Month nav for returned section -->
  <div class="row" style="align-items:center;margin-bottom:10px">
    <span class="sec-title" style="flex:1">📋 出租中</span>
    <button id="btnRefreshRentals" style="background:none;border:none;color:#f0a500;font-size:12px;cursor:pointer">重新整理</button>
  </div>
  <div id="rentalsList"></div>

  <!-- Returned section -->
  <div style="margin-top:16px">
    <div class="month-nav">
      <button class="month-nav-btn" id="btnReturnedPrev">‹</button>
      <span class="month-nav-title" id="returnedMonthTitle">已歸還</span>
      <button class="month-nav-btn" id="btnReturnedNext">›</button>
    </div>
    <div id="returnedList"></div>
  </div>
</div>

<!-- ═══ PANE: 租單內頁 ═══ -->
<div id="pane-rental-detail" class="tab-pane">
  <!-- back + title -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <button id="btnBackToRentals" class="btn btn-dark btn-sm" style="flex-shrink:0">← 返回</button>
    <span id="rdTitle" style="font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
  <div class="card" style="margin-bottom:10px">
    <div id="rdMeta" style="font-size:12px;color:#aaa;line-height:2"></div>
  </div>
  <!-- action buttons -->
  <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <button id="btnEditRental"   class="btn btn-blue"  style="flex:1;min-width:120px">✏️ 編輯租單</button>
    <button id="btnReturnAll"    class="btn btn-gold"  style="flex:1;min-width:120px">✅ 一鍵全數歸還</button>
  </div>
  <div class="row" style="gap:8px;margin-bottom:8px">
    <button id="btnScanReturn"   class="btn btn-dark"  style="flex:1">📷 掃描歸還</button>
    <button id="btnRdExportPDF"  class="btn btn-dark"  style="flex:1">📄 PDF</button>
  </div>
  <div id="qrReturn" class="scan-box" style="margin-bottom:8px">
    <div class="scan-focus-hint">點擊畫面對焦</div>
  </div>
  <!-- item list top-to-bottom -->
  <div id="rdItems"></div>
</div>

<!-- ═══ PANE: 器材列表 ═══ -->
<div id="pane-list" class="tab-pane">
  <div class="row" style="align-items:center;margin-bottom:8px">
    <span class="sec-title" style="flex:1">所有器材</span>
    <button id="btnRefreshList" style="background:none;border:none;color:#f0a500;font-size:12px;cursor:pointer">重新整理</button>
  </div>
  <input type="text" id="searchEquip" class="inp" style="margin-bottom:8px" placeholder="搜尋器材名稱…"/>
  <div id="equipmentList"></div>
</div>

<!-- ═══ PANE: 狀態表 ═══ -->
<div id="pane-status" class="tab-pane">
  <div class="row" style="align-items:center;margin-bottom:10px">
    <span class="sec-title" style="flex:1">🔧 維修中器材</span>
    <button id="btnOpenRepairForm" class="btn btn-gold btn-sm">＋ 回報維修</button>
  </div>
  <div id="repairCurrentList"></div>

  <div id="repairFormArea" style="display:none;margin-top:12px">
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:500;flex:1">掃描器材 QR</span>
        <button id="btnScan2" class="btn btn-gold btn-sm">開始掃描</button>
      </div>
      <div id="qr2" class="scan-box">
        <div class="scan-focus-hint">點擊畫面對焦</div>
      </div>
    </div>
    <div class="card">
      <label class="lbl">器材名稱（可自行輸入）</label>
      <input id="statusName" class="inp gap" placeholder="掃描後自動填入"/>
      <label class="lbl">編號</label>
      <input id="statusCode" class="inp gap" placeholder="掃描後自動填入"/>
      <label class="lbl">器材狀況</label>
      <select id="statusType" class="inp gap">
        <option value="repair">維修中</option>
        <option value="unhandled">未處理</option>
      </select>
      <label class="lbl">填寫人</label>
      <select id="statusUser" class="inp gap">
        <option value="">選擇填寫人</option>
        <option>崇瑋</option><option>得生</option><option>純穎</option>
        <option>哲嘉</option><option>子禎</option><option>錢琦</option>
        <option>致瑋</option><option>家暉</option><option>冠智</option>
      </select>
      <label class="lbl">日期</label>
      <input type="date" id="statusDate" class="inp gap"/>
      <label class="lbl">備註</label>
      <textarea id="statusNote" class="inp" rows="2" style="margin-bottom:10px" placeholder="填寫備註…"></textarea>
      <div class="row">
        <button id="btnCancelRepairForm" class="btn btn-dark">取消</button>
        <button id="btnSaveStatus"       class="btn btn-gold">💾 送出維修回報</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ PANE: 盤點表 ═══ -->
<div id="pane-inventory" class="tab-pane">
  <div class="row" style="align-items:center;margin-bottom:6px">
    <span class="sec-title" style="flex:1">📊 盤點表</span>
    <button id="btnRefreshInv" style="background:none;border:none;color:#f0a500;font-size:12px;cursor:pointer">重新整理</button>
  </div>
  <!-- month navigation -->
  <div class="month-nav" style="margin-bottom:10px">
    <button class="month-nav-btn" id="btnInvPrev">‹</button>
    <span class="month-nav-title" id="invMonthTitle"></span>
    <button class="month-nav-btn" id="btnInvNext">›</button>
  </div>
  <div id="inventoryList"></div>
</div>

<!-- ═══ PANE: 入庫 ═══ -->
<div id="pane-inbound" class="tab-pane">
  <p class="sec-title">器材入庫</p>
  <div class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:500;flex:1">掃描 QR Code</span>
      <button id="btnScan3" class="btn btn-gold btn-sm">開始掃描</button>
    </div>
    <div id="qr3" class="scan-box">
      <div class="scan-focus-hint">點擊畫面對焦</div>
    </div>
  </div>
  <div class="card">
    <label class="lbl">分類</label>

/* ════════ HELPERS ════════ */
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return String(n).padStart(2,'0');}
function p3(n){return String(n).padStart(3,'0');}
function fmtDate(s){if(!s)return'';var d=new Date(s);return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate());}
function fmtTime(s){if(!s)return'';var d=new Date(s);return p2(d.getHours())+':'+p2(d.getMinutes());}
function addDays(s,n){var d=new Date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function statBox(v,label,color){return '<div class="sbox"><div class="sv" style="color:'+color+'">'+v+'</div><div class="sl">'+label+'</div></div>';}

/* month offset helper */
function getOffsetYM(offset){
  var d=new Date();
  d.setMonth(d.getMonth()+offset);
  return{y:d.getFullYear(),m:d.getMonth()+1};
}
function ym2str(y,m){return y+'-'+p2(m);}
var MN_ZH=['一','二','三','四','五','六','七','八','九','十','十一','十二'];

function updateInvMonthLabel(){
  var ym=getOffsetYM(invMonthOffset);
  document.getElementById('invMonthTitle').textContent=ym.y+'年'+MN_ZH[ym.m-1]+'月 盤點';

}
function updateReturnedMonthLabel(){

}

/* ── keyword highlight ── */
function hlName(name){
  var kws=getKws(); if(!kws.length)return escHtml(name);
  var result=escHtml(name);
  kws.forEach(function(kw){
    if(!kw)return;
    var re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    result=result.replace(re,'<span class="kw">$1</span>');
  });
  return result;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── QR parse ── */
function parseQR(text){
  text=text.trim();
  if(text.includes('#')){var parts=text.split('#');return{name:parts[0].trim(),code:parts.slice(1).join('#').trim()};}
  try{var o=JSON.parse(text);return{name:o.name||'',code:o.code||o.id||''};}catch(_){}
  var p=text.split('|');
  if(p.length>=2)return{name:p[0].trim(),code:p[1].trim()};
  return{name:text,code:''};
}

/* ════════ SCANNER ════════ */
var SCAN_CONFIG={fps:30,qrbox:{width:220,height:220},aspectRatio:1.0,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};

async function toggleScan(divId,btnId,cb){
  var btn=document.getElementById(btnId),div=document.getElementById(divId);
  if(scanActive[divId]){await stopScan(divId);btn.textContent='開始掃描';div.style.display='none';return;}
  div.style.display='block';btn.textContent='停止掃描';
  try{
    var sc=new Html5Qrcode(divId);scanners[divId]=sc;
    await sc.start({facingMode:'environment'},SCAN_CONFIG,
      function(text){cb(text);stopScan(divId);btn.textContent='開始掃描';div.style.display='none';},
      function(){}
    );
    scanActive[divId]=true;
  }catch(e){toast('無法開啟相機：'+e,'err');div.style.display='none';btn.textContent='開始掃描';}
}
async function stopScan(divId){
  if(scanners[divId]){try{await scanners[divId].stop();}catch{}try{await scanners[divId].clear();}catch{}delete scanners[divId];}
  scanActive[divId]=false;
}
async function stopAllScan(){
  for(var id in scanActive){if(scanActive[id])await stopScan(id);}
  ['btnScan1','btnScan2','btnScan3','btnScanReturn'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.textContent='開始掃描';
  });
  ['qr1','qr2','qr3','qrReturn'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.style.display='none';
  });
}

async function onCheckoutScan(text){

  if(DB){
    var chk=await DB.from('equipments').select('status').eq('code',q.code).maybeSingle();

      document.getElementById('repairWarn').style.display='block';
      vibrate([100,50,100]);

    vibrate(200);toast('⚠️ 已在清單中：'+q.name,'warn');return;

/* clear checkout form (non-edit mode only) */
function clearCheckoutForm(){
  document.getElementById('checkoutUser').value='';
  document.getElementById('checkoutOrderNo').value='';
  document.getElementById('checkoutDate').value=todayStr();
  checkoutItems=[];
  renderCheckoutItems();
  editModeOrderId=null;
  document.getElementById('editModeBanner').style.display='none';
}

async function saveCheckout(){
  var user=document.getElementById('checkoutUser').value;
  var date=document.getElementById('checkoutDate').value;
  var order=document.getElementById('checkoutOrderNo').value;
  if(!user){toast('請選擇使用者','warn');return;}
  if(!checkoutItems.length){toast('請先掃描器材','warn');return;}
  var data=buildCheckoutData();

  if(DB){
    try{
      if(editModeOrderId!==null){
        /* ── EDIT MODE: overwrite ── */
        // 1. mark old rentals returned → free those equipment
        var oldR=await DB.from('rentals').select('*').eq('order_no',editModeOrderId).eq('status','rented');
        if(oldR.data){
          for(var i=0;i<oldR.data.length;i++){
            await DB.from('rentals').update({status:'returned',returned_at:new Date().toISOString()}).eq('id',oldR.data[i].id);
            await DB.from('equipments').update({status:'available'}).eq('code',oldR.data[i].equipment_code);
          }
        }
        // 2. insert new rows
        var rows=checkoutItems.map(function(item){
          return{equipment_name:item.name,equipment_code:item.code,user_name:user,
            order_no:order||editModeOrderId||null,checkout_date:date,checkout_time:item.at,status:'rented'};
        });
        var r2=await DB.from('rentals').insert(rows);
        if(r2.error)throw r2.error;
        for(var j=0;j<checkoutItems.length;j++){
          await DB.from('equipments').update({status:'rented'}).eq('code',checkoutItems[j].code);
        }
        toast('✅ 租單已覆蓋更新','ok');
      } else {
        /* ── NORMAL MODE ── */
        var rows2=checkoutItems.map(function(item){
          return{equipment_name:item.name,equipment_code:item.code,user_name:user,
            order_no:order||null,checkout_date:date,checkout_time:item.at,status:'rented'};
        });
        var r3=await DB.from('rentals').insert(rows2);
        if(r3.error)throw r3.error;
        for(var k=0;k<checkoutItems.length;k++){
          await DB.from('equipments').update({status:'rented'}).eq('code',checkoutItems[k].code);
        }
      }
    }catch(e){toast('DB警告：'+e.message,'warn');}
  }

  lastSavedData=data;
  var wasEdit=(editModeOrderId!==null);
  editModeOrderId=null;
  document.getElementById('editModeBanner').style.display='none';

  // clear form if NOT edit mode (edit mode also clears since we're done)
  clearCheckoutForm();
  refreshTopBadge();
  showSavedPane(data);
}

function showSavedPane(data){
  document.querySelectorAll('.tab-pane').forEach(function(el){el.classList.remove('active');});
  document.getElementById('pane-saved').classList.add('active');
  document.getElementById('savedTitle').textContent=(data.orderNo||'出庫單')+' · '+fmtDate(data.date);
  document.getElementById('savedMeta').innerHTML=
    '借用人：<b style="color:#e8e8e8">'+data.user+'</b><br>'
    +'出租日期：<b style="color:#e8e8e8">'+fmtDate(data.date)+'</b><br>'
    +'單號：<b style="color:#e8e8e8">'+(data.orderNo||'—')+'</b>';
  document.getElementById('savedList').innerHTML=data.items.map(function(item){
    return '<div class="card" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      +'<span class="chip c-orange" style="flex-shrink:0;font-size:10px">出租中</span>'

function copyLineList(){
  if(!lastSavedData){toast('無資料','warn');return;}
  var d=lastSavedData;
  var lines=['【出庫單】','單號：'+(d.orderNo||'—'),'借用人：'+d.user,'日期：'+fmtDate(d.date),''];
  d.items.forEach(function(item,i){lines.push((i+1)+'. '+item.name+' #'+item.code);});
  lines.push('','請確認收到以上器材，謝謝！');
  var text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('已複製！可貼入 LINE','ok');}).catch(function(){fallbackCopy(text);});
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已複製','ok');}catch(e){toast('複製失敗，請手動複製','err');}
  document.body.removeChild(ta);
}

/* ── returned rentals ── */
async function loadReturnedRentals(){
  var c=document.getElementById('returnedList');
  if(!DB){c.innerHTML='';return;}

  var ym=getOffsetYM(returnedMonthOffset);
  var monthStart=ym2str(ym.y,ym.m)+'-01';
  var nextYm=getOffsetYM(returnedMonthOffset+1);
  var monthEnd=ym2str(nextYm.y,nextYm.m)+'-01';

  // auto-delete records returned >3 months ago
  var threeMonthsAgo=new Date();threeMonthsAgo.setMonth(threeMonthsAgo.getMonth()-3);
  var cutoff=threeMonthsAgo.getFullYear()+'-'+p2(threeMonthsAgo.getMonth()+1)+'-'+p2(threeMonthsAgo.getDate());
  await DB.from('rentals').delete().eq('status','returned').lt('returned_at',cutoff+'T00:00:00');

  var r=await DB.from('rentals').select('*').eq('status','returned')
    .gte('returned_at',monthStart+'T00:00:00')
    .lt('returned_at',monthEnd+'T00:00:00')
    .order('returned_at',{ascending:false});
  var data=r.data||[];

  if(!data.length){c.innerHTML='<div style="text-align:center;color:#888;font-size:11px;padding:16px 0">本月無歸還紀錄</div>';return;}

  var groups={};
  data.forEach(function(row){
    var key=row.order_no||('__no__'+row.user_name+'__'+row.checkout_date);
    if(!groups[key]){groups[key]={orderNo:row.order_no,user:row.user_name,date:row.checkout_date,returnedAt:row.returned_at,items:[]};}
    groups[key].items.push(row);
  });

  c.innerHTML=Object.values(groups).map(function(g){
    return '<div class="card" style="opacity:0.75">'
      +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span class="chip c-green" style="font-size:10px">已歸還</span>'
        +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:600">'+(g.orderNo||'（無單號）')+'</div>'
          +'<div style="font-size:10px;color:#888">'+g.user+' · '+fmtDate(g.date)+' · '+g.items.length+'件 · 還：'+fmtDate((g.returnedAt||'').slice(0,10))+'</div>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

/* ════════ SCHEDULE MODAL ════════ */
async function openSchedule(name,code){
  calEquipName=name;calEquipCode=code;
  var now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();calRentals=[];
  if(DB){var r=await DB.from('rentals').select('*').eq('equipment_code',code).in('status',['rented','returned']);calRentals=r.data||[];}
  renderCal();openModal('modalSchedule');
}
function changeCalMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCal();}
function renderCal(){
  var MN=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('calTitle').textContent=calEquipName+' · '+calYear+'年'+MN[calMonth]+'月';
  var grid=document.getElementById('calGrid');
  var DN=['日','一','二','三','四','五','六'];
  var html=DN.map(function(d){return'<div style="font-size:10px;color:#888;padding:3px 0">'+d+'</div>';}).join('');
  var first=new Date(calYear,calMonth,1).getDay(),days=new Date(calYear,calMonth+1,0).getDate();
  var today=new Date();
  var rSet=new Set(calRentals.map(function(r){return(r.checkout_date||'').slice(0,10);}));
  for(var i=0;i<first;i++)html+='<div></div>';
  for(var d=1;d<=days;d++){
    var ds=calYear+'-'+p2(calMonth+1)+'-'+p2(d);
    var cls='cal-day';
    if(rSet.has(ds))cls+=' rented';
    if(today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d)cls+=' today';
    html+='<div><div class="'+cls+'" data-date="'+ds+'">'+d+'</div></div>';
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-day').forEach(function(el){el.addEventListener('click',function(){showDayDetail(el.dataset.date);});});
}
function showDayDetail(ds){
  var recs=calRentals.filter(function(r){return(r.checkout_date||'').slice(0,10)===ds;});
  var el=document.getElementById('calDetail');
  if(!recs.length){el.innerHTML='<div style="text-align:center;color:#888;font-size:12px">'+ds+' 無記錄</div>';return;}
  el.innerHTML='<div style="font-size:11px;color:#888;margin-bottom:5px">'+ds+'：</div>'
    +recs.map(function(r){return'<div class="card" style="margin-bottom:5px"><div style="font-size:13px;font-weight:500">'+r.user_name+'</div><div style="font-size:11px;color:#888">單號：'+(r.order_no||'-')+'</div></div>';}).join('');
}

  renderEquipList(allEquipments.filter(function(e){return e.name.toLowerCase().includes(q)||(e.code||'').toLowerCase().includes(q);}));

function renderEquipList(list){
  var c=document.getElementById('equipmentList');
  if(!list.length){c.innerHTML='<div style="text-align:center;color:#888;font-size:12px;padding:30px 0">暫無器材<br><span style="font-size:10px">請先入庫器材</span></div>';return;}

  var catMap={};
  list.forEach(function(e){
    var cat=e.category||'其他';
    if(!catMap[cat])catMap[cat]={};
    var nm=e.name;
    if(!catMap[cat][nm])catMap[cat][nm]=[];
    catMap[cat][nm].push(e);
  });

  var cats=getCats().concat(['其他']);
  var html='';
  cats.forEach(function(cat){
    if(!catMap[cat])return;
    html+='<div class="cat-hd">'+cat+'</div>';
    Object.keys(catMap[cat]).forEach(function(nm){
      var items=catMap[cat][nm];
      var codes=items.map(function(x){return'#'+(x.code||'?');}).join(' ');
      var totalQ=items.length; // each row = 1 unit
      var repairQ=items.filter(function(x){return x.status==='repair'||x.status==='unhandled';}).length;
      var rentedQ=items.filter(function(x){return x.status==='rented';}).length;
      var availQ=Math.max(0,totalQ-repairQ-rentedQ);
      var repStr=repairQ>0?'<span class="chip c-red" style="font-size:10px;margin-left:4px">'+repairQ+'維修</span>':'';

function bindEquipEvents(c){
  c.querySelectorAll('.sw-wrap').forEach(function(wrap){
    var card=wrap.querySelector('.sw-card');
    var startX=0,lpTimer=null;
    card.addEventListener('touchstart',function(e){
      startX=e.touches[0].clientX;
      lpTimer=setTimeout(function(){card.style.transform='translateX(-72px)';},600);
    },{passive:true});
    card.addEventListener('touchmove',function(e){
      clearTimeout(lpTimer);
      var dx=e.touches[0].clientX-startX;
      if(dx<0)card.style.transform='translateX('+Math.max(dx,-72)+'px)';
      else card.style.transform='';
    },{passive:true});
    card.addEventListener('touchend',function(e){
      clearTimeout(lpTimer);
      var dx=e.changedTouches[0].clientX-startX;
      if(dx<-40)card.style.transform='translateX(-72px)';
      else if(dx>10)card.style.transform='';
    });
    card.addEventListener('click',function(){card.style.transform='';});
  });

  // delete
  c.querySelectorAll('.sw-del').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var name=btn.dataset.delName,cat=btn.dataset.delCat;
      var items=allEquipments.filter(function(x){return x.name===name&&(x.category||'其他')===cat;});
      confirm2('刪除器材','確定刪除「'+name+'」所有 '+items.length+' 件？',async function(){
        if(!DB){toast('請先設定 Supabase','err');return;}
        for(var i=0;i<items.length;i++){
          await DB.from('equipments').delete().eq('id',items[i].id);
        }
        toast('已刪除：'+name,'ok');loadEquipList();
      });
    });
  });

  // edit
  c.querySelectorAll('[data-edit-name]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var name=btn.dataset.editName,cat=btn.dataset.editCat;
      var items=allEquipments.filter(function(x){return x.name===name&&(x.category||'其他')===cat;});
      if(!items.length)return;
      document.getElementById('editEquipId').value=items.map(function(x){return x.id;}).join(',');
      document.getElementById('editEquipName').value=name;
      populateCatSelects();
      document.getElementById('editEquipCat').value=cat;
      document.getElementById('editEquipQty').value=items.length; // count of physical units
      openModal('modalEditEquip');
    });
  });

  // 大表 (history)
  c.querySelectorAll('[data-history-name]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var name=btn.dataset.historyName;
      var items=allEquipments.filter(function(x){return x.name===name;});
      if(items.length)openSchedule(name,items[0].code);
    });
  });
}

async function confirmEditEquip(){
  var ids=document.getElementById('editEquipId').value.split(',');
  var name=document.getElementById('editEquipName').value.trim();
  var cat=document.getElementById('editEquipCat').value;
  var newQty=parseInt(document.getElementById('editEquipQty').value)||0;
  if(!name){toast('請填寫名稱','warn');return;}
  if(!DB){toast('請先設定 Supabase','err');return;}

  var currentItems=allEquipments.filter(function(x){return x.name===document.getElementById('editEquipName').value&&(x.category||'其他')===cat;});
  var currentCount=currentItems.length||ids.length;

  if(newQty<currentCount){
    // remove extra items (from the end, prefer available ones)
    var toRemove=currentCount-newQty;
    var available=currentItems.filter(function(x){return x.status==='available';});
    var removeList=available.slice(0,toRemove);
    if(removeList.length<toRemove){toast('無法減少：有器材出租或維修中','warn');closeModal('modalEditEquip');return;}
    for(var i=0;i<removeList.length;i++){
      await DB.from('equipments').delete().eq('id',removeList[i].id);
    }
  } else if(newQty>currentCount){
    // add new units
    var addCount=newQty-currentCount;
    var existingCodes=currentItems.map(function(x){return parseInt((x.code||'0').replace(/\D/g,''))||0;});
    var maxCode=existingCodes.length?Math.max.apply(null,existingCodes):0;
    for(var j=0;j<addCount;j++){
      var codeNum=maxCode+j+1;
      await DB.from('equipments').insert([{name:name,code:p3(codeNum),total_qty:1,rented_qty:0,repair_qty:0,status:'available',category:cat}]);
    }
  }
  // update name & category for all existing
  for(var k=0;k<ids.length;k++){
    await DB.from('equipments').update({name:name,category:cat}).eq('id',ids[k]);
  }
  toast('已更新（數量：'+newQty+'）','ok');closeModal('modalEditEquip');loadEquipList();
}

async function loadInventory(){
  var c=document.getElementById('inventoryList');
  if(!DB){c.innerHTML='<div style="text-align:center;color:#888;font-size:12px;padding:30px 0">請先設定 Supabase</div>';return;}

  var re=await DB.from('equipments').select('*').order('category').order('name');
  var rr=await DB.from('rentals').select('equipment_code').eq('status','rented');
  if(!re.data)return;

  var rentedCodes=new Set((rr.data||[]).map(function(x){return x.equipment_code;}));

  // Load this month's inventory check data from localStorage
  var ym=getOffsetYM(invMonthOffset);
  var monthKey='inv_'+ym.y+'_'+p2(ym.m);

  var catMap={};
  re.data.forEach(function(e){
    var cat=e.category||'其他';
    if(!catMap[cat])catMap[cat]={};
    if(!catMap[cat][e.name])catMap[cat][e.name]=[];
    catMap[cat][e.name].push(e);
  });

  var cats=getCats().concat(['其他']);
  var html='';
  cats.forEach(function(cat){
    if(!catMap[cat])return;
    html+='<div style="margin-bottom:16px"><div class="cat-hd">'+cat+'</div>';
    Object.keys(catMap[cat]).forEach(function(nm){
      var items=catMap[cat][nm];
      var total=items.length;
      var repairCnt=items.filter(function(x){return x.status==='repair'||x.status==='unhandled';}).length;
      var rentedCnt=items.filter(function(x){return x.status==='rented';}).length;
      var rentedCntAlt=items.filter(function(x){return rentedCodes.has(x.code);}).length;
      rentedCnt=Math.max(rentedCnt,rentedCntAlt);
      var inStock=Math.max(0,total-repairCnt-rentedCnt);

      // Load checked state for each item this month
      var invKey=monthKey+'_'+cat+'_'+nm;
      var checked=JSON.parse(localStorage.getItem(invKey)||'{}');
      var checkedCount=Object.keys(checked).filter(function(k){return checked[k];}).length;

      // anomaly detection: items not checked, not rented, not repair = lost
      var lostCnt=0;
      items.forEach(function(e){
        if(e.status!=='rented'&&e.status!=='repair'&&e.status!=='unhandled'&&!checked[e.id]){
          lostCnt++;
        }
      });
      // subtract already-checked
      lostCnt=Math.max(0,inStock-checkedCount);

      var monthly=JSON.parse(localStorage.getItem('monthly_'+cat+'_'+nm)||'{}');
      var checkedMonths=Object.keys(monthly).filter(function(m){return monthly[m];}).length;

      html+='<div class="card" style="margin-bottom:8px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'
          +'<div style="flex:1;min-width:0">'
            +'<div style="font-size:13px;font-weight:600">'+hlName(nm)+'</div>'
            +'<div style="font-size:10px;color:#aaa;margin-top:2px">'
              +'總數 '+total+' | 已點 '+checkedCount+' | 出租中 '+rentedCnt+' | 維修 '+repairCnt+(lostCnt>0?' | <span style="color:#a855f7;font-weight:700">遺失 '+lostCnt+'</span>':'')
            +'</div>'
          +'</div>'
        +'</div>'
        +'<div style="display:flex;gap:5px;margin-bottom:8px">'
          +statBox(total,'總數','#e8e8e8')
          +statBox(checkedCount,'已點','#22c55e')
          +statBox(rentedCnt,'出租','#f59e0b')
          +statBox(repairCnt,'維修','#ef4444')
          +(lostCnt>0?statBox(lostCnt,'遺失','#a855f7'):'')
        +'</div>'
        +'<div style="display:flex;gap:6px">'
          +'<button class="btn btn-gold btn-sm" style="font-size:11px;flex:1" data-inv-name="'+escHtml(nm)+'" data-inv-cat="'+cat+'" data-inv-key="'+invKey+'">✅ 逐項點核</button>'
          +'<button class="btn btn-dark btn-sm" style="font-size:11px;flex:1" data-monthly-name="'+escHtml(nm)+'" data-monthly-cat="'+cat+'">'
            +'📅 月份點檢 ('+(checkedMonths||0)+'/12)'
          +'</button>'
        +'</div>'
      +'</div>';
    });
    html+='</div>';
  });

  c.innerHTML=html||'<div style="text-align:center;color:#888;font-size:12px;padding:30px 0">暫無器材資料</div>';

  // item check buttons
  c.querySelectorAll('[data-inv-name]').forEach(function(btn){
    btn.addEventListener('click',function(){
      openInvItemModal(btn.dataset.invName,btn.dataset.invCat,btn.dataset.invKey);
    });
  });

  // monthly check buttons
  c.querySelectorAll('[data-monthly-name]').forEach(function(btn){
    btn.addEventListener('click',function(){
      monthlyEquipName=btn.dataset.monthlyName;
      monthlyEquipCat=btn.dataset.monthlyCat;
      openMonthlyModal(monthlyEquipName,monthlyEquipCat);
    });
  });
}

/* ── inventory item modal (per-unit checkboxes) ── */
async function openInvItemModal(nm,cat,invKey){
  document.getElementById('invItemTitle').textContent=nm+' 逐項點核';
  var items=allEquipments.filter(function(x){return x.name===nm&&(x.category||'其他')===cat;});
  if(!items.length){
    // try re-fetch
    if(DB){var r=await DB.from('equipments').select('*').eq('name',nm);items=r.data||[];}
  }
  var checked=JSON.parse(localStorage.getItem(invKey)||'{}');
  // rental status
  var rentedCodes=new Set();
  if(DB){var rr=await DB.from('rentals').select('equipment_code').eq('status','rented');(rr.data||[]).forEach(function(x){rentedCodes.add(x.equipment_code);});}

  var total=items.length;
  var checkedNow=items.filter(function(e){return checked[e.id];}).length;
  var rentedNow=items.filter(function(e){return e.status==='rented'||rentedCodes.has(e.code);}).length;
  var repairNow=items.filter(function(e){return e.status==='repair'||e.status==='unhandled';}).length;
  var inStock=Math.max(0,total-repairNow-rentedNow);
  var lostNow=Math.max(0,inStock-checkedNow);

  document.getElementById('invItemSummary').innerHTML=
    '總數 '+total+' | 已點 '+checkedNow+' | 出租中 '+rentedNow+' | 維修 '+repairNow
    +(lostNow>0?' | <span style="color:#a855f7;font-weight:700">遺失 '+lostNow+'</span>':'');

  var html='';
  items.forEach(function(e){
    var isRented=(e.status==='rented'||rentedCodes.has(e.code));
    var isRepair=(e.status==='repair'||e.status==='unhandled');
    var isChecked=!!checked[e.id];
    var inStockItem=!isRented&&!isRepair;
    var isLost=inStockItem&&!isChecked;

    var cbClass='inv-cb';
    var cbContent='';
    var statusLabel='';
    var statusColor='#888';
    if(isRented){cbClass+=' rented';cbContent='⬡';statusLabel='出租中';statusColor='#f59e0b';}
    else if(isRepair){cbClass+=' repair';cbContent='🔧';statusLabel=(e.status==='unhandled'?'未處理':'維修中');statusColor='#ef4444';}
    else if(isChecked){cbClass+=' checked';cbContent='✓';statusLabel='已點';}
    else if(isLost){cbClass+=' lost';cbContent='?';statusLabel='遺失';statusColor='#a855f7';}

    html+='<div class="inv-check-item">'
      +'<div class="'+cbClass+'" data-equip-id="'+e.id+'" data-inv-key="'+escHtml(invKey)+'" style="'+(isRented||isRepair?'pointer-events:none':'')+'">'+cbContent+'</div>'
      +'<div style="flex:1">'
        +'<div style="font-size:13px;font-weight:500">'+hlName(e.name)+' <span style="font-weight:400;color:#888;font-size:11px">#'+(e.code||'?')+'</span></div>'
        +(statusLabel?'<div style="font-size:10px;color:'+statusColor+'">'+statusLabel+'</div>':'')
      +'</div>'
    +'</div>';
  });
  document.getElementById('invItemChecks').innerHTML=html;

  // bind clicks
  document.getElementById('invItemChecks').querySelectorAll('.inv-cb:not([style*="pointer-events"])').forEach(function(cb){
    cb.addEventListener('click',function(){
      var eid=cb.dataset.equipId;
      var key=cb.dataset.invKey;
      var saved=JSON.parse(localStorage.getItem(key)||'{}');
      saved[eid]=!saved[eid];
      localStorage.setItem(key,JSON.stringify(saved));
      // re-open
      openInvItemModal(nm,cat,invKey);
    });
  });

  openModal('modalInvItem');
}

async function saveInbound(){
  var name=document.getElementById('inboundName').value.trim();
  var startCodeRaw=document.getElementById('inboundStartCode').value.trim();
  var qty=parseInt(document.getElementById('inboundQty').value)||1;
  var note=document.getElementById('inboundNote').value.trim();
  var cat=document.getElementById('inboundCat').value;
  if(!name){toast('請填寫器材名稱','warn');return;}
  if(!DB){toast('請先設定 Supabase','err');openSettings();return;}

  var startNum=parseInt(startCodeRaw)||1;
  var existing=await DB.from('equipments').select('code').eq('name',name);
  var existingNums=(existing.data||[]).map(function(e){
    return parseInt((e.code||'0').replace(/\D/g,''))||0;
  });
  if(existingNums.length){
    var maxExist=Math.max.apply(null,existingNums);
    if(startNum<=maxExist) startNum=maxExist+1;
  }

  try{
    for(var i=0;i<qty;i++){
      var codeNum=startNum+i;
      var code=p3(codeNum);
      var r=await DB.from('equipments').insert([{
        name:name,code:code,total_qty:1,rented_qty:0,repair_qty:0,
        status:'available',category:cat,note:note||null
      }]);
      if(r.error)throw r.error;
      inboundSaved.push({name:name,code:code,cat:cat,qty:1,note:note});
    }
    renderInboundSaved();
    document.getElementById('inboundName').value='';
    document.getElementById('inboundStartCode').value='';
    document.getElementById('inboundQty').value='1';
    document.getElementById('inboundNote').value='';
    toast('✅ 入庫 '+qty+' 件：'+name+' #'+p3(startNum)+(qty>1?'~#'+p3(startNum+qty-1):''),'ok');
  }catch(e){toast('入庫失敗：'+e.message,'err');}
}

/* ════════ PDF ════════ */
async function exportPDF(data){
  if(!data||!data.items||!data.items.length){toast('沒有出庫品項','warn');return;}
  var returnDate=addDays(data.date||todayStr(),1);
  var rows=data.items.map(function(item,i){
    return'<tr style="border-bottom:1px solid #eee">'
      +'<td style="padding:7px 6px;font-size:12px;color:#333">'+(i+1)+'</td>'
      +'<td style="padding:7px 6px;font-size:13px;font-weight:600;color:#1a1a1a">'+escHtml(item.name)+'</td>'
      +'<td style="padding:7px 6px;font-size:12px;color:#555">#'+escHtml(item.code)+'</td>'
      +'<td style="padding:7px 6px;font-size:11px;color:#777">'+fmtTime(item.at)+'</td>'
    +'</tr>';
  }).join('');

  var html='<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"/>'
    +'<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet"/>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"Noto Sans TC",sans-serif;background:#fff;color:#1a1a1a;padding:28px 24px;}'
    +'.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;border-bottom:3px solid #f0a500;padding-bottom:14px;}'
    +'.logo{font-size:20px;font-weight:700;}.logo span{color:#f0a500;}'
    +'.badge{background:#f0a500;color:#1a1a1a;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;}'
    +'.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:20px;padding:14px;background:#f9f9f9;border-radius:9px;border-left:4px solid #f0a500;}'
    +'.ml{font-size:9px;color:#888;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}'
    +'.mv{font-size:14px;font-weight:600;color:#1a1a1a;}'
    +'table{width:100%;border-collapse:collapse;}thead tr{background:#1a1a1a;}thead th{padding:9px 6px;font-size:11px;color:#fff;text-align:left;}'
    +'tbody tr:nth-child(even){background:#fafafa;}'
    +'.sign{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:36px;}'
    +'.sb{border-top:1.5px solid #ccc;padding-top:6px;font-size:10px;color:#888;}'
    +'@media print{body{padding:14px;}}</style></head><body>'
    +'<div class="hd"><div><div class="logo">📷 <span>MGR攝影組器材管理</span></div>'
    +'<div style="font-size:11px;color:#888;margin-top:3px">器材出庫單</div></div>'
    +'<div class="badge">出租中</div></div>'
    +'<div class="meta">'
    +'<div><div class="ml">借用人</div><div class="mv">'+(data.user||'—')+'</div></div>'
    +'<div><div class="ml">單號</div><div class="mv">'+(data.orderNo||'—')+'</div></div>'
    +'<div><div class="ml">出租日期</div><div class="mv">'+fmtDate(data.date)+'</div></div>'
    +'<div><div class="ml">預計歸還</div><div class="mv">'+fmtDate(returnDate)+'</div></div>'
    +'</div>'
    +'<table><thead><tr><th style="width:30px">#</th><th>器材名稱</th><th>編號</th><th>掃描時間</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<div class="sign">'
    +'<div class="sb">借用人簽名 / '+(data.user||'')+'</div>'
    +'<div class="sb">管理員簽名</div>'
    +'</div>'
    +'<div style="margin-top:28px;font-size:10px;color:#bbb;text-align:center">出庫時間：'+new Date().toLocaleString('zh-TW')+'</div>'
    +'</body></html>';

  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var fname=(data.orderNo||data.user||'checkout')+'_'+returnDate+'.html';
  var file=new File([blob],fname,{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'出庫單'});return;}catch(e){if(e.name==='AbortError')return;}
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=fname;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
  toast('已下載出庫單（用瀏覽器列印為PDF）');
}
</script>
</body>
</html>
